name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Download and open / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Python with Tk
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download this revision and test the documented installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/zipball/$GITHUB_SHA" > source.zip
          unset GH_TOKEN
          python -m zipfile -e source.zip unpacked
          cd unpacked/*/
          python -m venv .venv
          if [[ "$RUNNER_OS" == Windows ]]; then
            py=.venv/Scripts/python.exe
          else
            py=.venv/bin/python
          fi
          "$py" -m pip install -e ".[dev]"
          "$py" scripts/initialize_workspace.py
          "$py" job_radar.py --help
          "$py" -c "import tkinter as tk; from job_radar.gui import JobRadarApp; window=tk.Tk(); app=JobRadarApp(window); window.update(); assert app.age_filter.get() == 'Recommended'; app._close(); assert app._closed"

  windows:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python with Tk
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install the locked dependencies
        run: uv sync --frozen --all-extras
      - name: Check the files committed for publication
        run: .venv/Scripts/python.exe scripts/check_public_release.py --tracked
      - name: Check Tk is available
        run: .venv/Scripts/python.exe -c "import tkinter; w = tkinter.Tk(); w.withdraw(); w.update(); w.destroy()"
      - name: Run the offline test suite
        run: .venv/Scripts/python.exe -m pytest -q -rs -p no:cacheprovider --basetemp "${{ runner.temp }}/job-radar-tests"
