[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
version = "0.10.0"
description = "Manual-first job discovery records, application tracking and local reports, with optional AI experiments."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "openai>=2.0,<3",
  "pydantic>=2.8,<3",
  "pypdf>=6.10,<7",
  "pyyaml>=6.0,<7",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[project.scripts]
job-radar = "job_radar.cli:main"

[project.gui-scripts]
job-radar-gui = "job_radar.gui:main"

[tool.setuptools.packages.find]
include = ["job_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
